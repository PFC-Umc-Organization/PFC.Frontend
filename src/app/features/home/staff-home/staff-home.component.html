<header class="page-header">
  <div>
    <p class="eyebrow">Acompanhamento</p>
    <h1 class="page-title mt-2">Painel do PFC</h1>
    <p class="lead mt-2">Situação das entregas de cada grupo da turma, por atividade.</p>
  </div>
  <div class="field picker">
    <label class="field__label" for="cohort">Turma</label>
    <select id="cohort" class="control" [value]="cohortId()" (change)="chooseCohort($event)">
      @for (c of cohorts(); track c.id) {
        <option [value]="c.id" [selected]="c.id === cohortId()">{{ cohortLabel(c) }}</option>
      }
    </select>
  </div>
</header>

<app-status-grid
  [grid]="grid()"
  [loading]="loading()"
  [error]="error()"
  [selected]="selected()"
  [emptyText]="emptyText()"
  [penalties]="penalties()"
  [selectedPenalties]="penaltiesOf()?.projectId ?? null"
  (open)="openCell($event)"
  (openPenalties)="openPenalties($event)"
/>

@if (detail(); as d) {
  <app-submission-detail
    [projectId]="d.projectId"
    [projectName]="d.projectName"
    [activity]="d.activity"
    [submission]="d.submission"
    (closed)="selected.set(null)"
  />
}

@if (penaltyDetail(); as d) {
  <app-penalty-panel
    [projectName]="d.projectName"
    [penalties]="d.penalties"
    [activities]="grid().activities"
    (closed)="penaltiesOf.set(null)"
  />
}
