<section class="card panel" aria-labelledby="penalty-panel-title" aria-live="polite">
  <header class="panel__head">
    <div>
      <p class="eyebrow">Penalidades</p>
      <h2 id="penalty-panel-title" class="panel__title">{{ projectName() }}</h2>
    </div>
    <button type="button" class="btn btn--ghost btn--sm" (click)="closed.emit()">
      <app-icon name="close" class="btn__icon" />
      Fechar
    </button>
  </header>

  <div class="summary" [class.summary--failed]="penalties().reprovado">
    <div class="summary__status">
      <span class="summary__title">{{ summary().title }}</span>
      <app-penalty-counter [penalties]="penalties()" />
    </div>
    <p class="summary__text">{{ summary().text }}</p>
  </div>

  <div class="panel__body">
    <app-penalty-list [penalties]="penalties().penalidades" [projectId]="penalties().projetoId" [manageable]="true" />

    <form class="apply" [formGroup]="form" (ngSubmit)="apply()">
      <h3 class="apply__title">Aplicar penalidade</h3>
      <div class="form-grid form-grid--2">
        <div class="field">
          <label class="field__label" for="penalty-reason">Motivo</label>
          <input
            id="penalty-reason"
            class="control"
            maxlength="500"
            placeholder="Ex.: entrega não validada pelo orientador"
            formControlName="motivo"
          />
        </div>
        <div class="field">
          <label class="field__label" for="penalty-activity">Atividade (opcional)</label>
          <select id="penalty-activity" class="control" formControlName="atividadeId">
            <option value="">Nenhuma específica</option>
            @for (a of activities(); track a.id) {
              <option [value]="a.id">{{ a.titulo }}</option>
            }
          </select>
        </div>
      </div>
      @if (error()) {
        <p class="field__error" role="alert">{{ error() }}</p>
      }
      <div>
        <button type="submit" class="btn btn--primary btn--sm" [disabled]="applying()">
          {{ applying() ? 'Aplicando…' : 'Aplicar penalidade' }}
        </button>
      </div>
    </form>
  </div>
</section>
