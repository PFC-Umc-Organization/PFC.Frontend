<label class="field__label" [attr.for]="inputId">
  {{ field().rotulo }}
  @if (!field().obrigatorio) {
    <span class="optional">(opcional)</span>
  }
</label>

@switch (field().tipo) {
  @case ('ARQUIVO') {
    <app-file-picker
      [inputId]="inputId"
      [fileName]="value() ? fileNameOf(value()!) : ''"
      [progress]="progress()"
      [error]="error()"
      [extensions]="extensions()"
      [hint]="fileHint()"
      (picked)="upload($event)"
    />
  }
  @case ('TEXTO_LONGO') {
    <textarea [id]="inputId" class="control control--textarea" [value]="value() ?? ''" (input)="type($event)"></textarea>
  }
  @case ('LINK') {
    <input
      [id]="inputId"
      class="control"
      type="url"
      [placeholder]="placeholder()"
      [class.control--invalid]="linkError()"
      [attr.aria-invalid]="linkError() ? true : null"
      [value]="value() ?? ''"
      (input)="type($event)"
    />
    @if (linkError()) {
      <span class="field__error" role="alert">{{ linkError() }}</span>
    } @else if (linkHint()) {
      <span class="field__hint">{{ linkHint() }}</span>
    }
  }
  @default {
    <input [id]="inputId" class="control" type="text" [value]="value() ?? ''" (input)="type($event)" />
  }
}
