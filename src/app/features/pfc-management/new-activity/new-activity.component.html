<section class="card" aria-labelledby="new-activity-heading">
  <div class="card__body">
    <div class="form-head">
      <h2 id="new-activity-heading" class="section-title">Nova atividade</h2>
      <button type="button" class="btn btn--ghost btn--sm" (click)="closed.emit()">Cancelar</button>
    </div>
    <p class="lead text-sm mt-1">Cada atividade pertence a uma turma. Em "Todas as turmas" é criada uma cópia em cada uma, e depois cada cópia pode ter o prazo e os campos que a turma precisar.</p>

    @if (error()) {
      <p class="alert mt-4" role="alert">
        <app-icon name="alert" />
        <span>{{ error() }}</span>
      </p>
    }

    <form class="form-grid form-grid--2 mt-6" [formGroup]="form" (ngSubmit)="publish()">
      <div class="field form-grid__full">
        <label class="field__label" for="new-activity-cohort">Turma</label>
        <select id="new-activity-cohort" class="control" [value]="target()" (change)="chooseTarget($event)">
          <option [value]="allCohorts" [selected]="target() === allCohorts">Todas as turmas</option>
          @for (c of cohorts(); track c.id) {
            <option [value]="c.id" [selected]="c.id === target()">{{ cohortLabel(c) }}</option>
          }
        </select>
      </div>

      <app-activity-fields [form]="form" idPrefix="new-activity" titlePlaceholder="Ex.: Revisão Bibliográfica" />

      <app-field-list
        [fields]="fields()"
        hint="Campos que o grupo preenche ao enviar a entrega. É necessário ao menos um."
        (remove)="removeField($event)"
      >
        <app-field-adder (added)="addField($event)" />
      </app-field-list>

      <div class="form-grid__full">
        <button type="submit" class="btn btn--primary" [disabled]="saving()">
          <app-icon name="plus" class="btn__icon" />
          {{ saving() ? 'Publicando…' : 'Publicar atividade' }}
        </button>
      </div>
    </form>
  </div>
</section>
