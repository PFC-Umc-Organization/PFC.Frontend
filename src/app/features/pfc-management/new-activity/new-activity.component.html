<section class="card">
  <div class="card__body">
    <h2 class="section-title">Nova atividade</h2>
    <p class="lead text-sm mt-1">Informe os dados da próxima entrega.</p>

    @if (published()) {
      <p class="ok mt-4" role="status">
        <app-icon name="check" />
        Atividade publicada. Ela já aparece na timeline de todos os projetos.
      </p>
    }
    @if (error()) {
      <p class="alert mt-4" role="alert">
        <app-icon name="alert" />
        <span>{{ error() }}</span>
      </p>
    }

    <form class="form-grid form-grid--2 mt-6" [formGroup]="form" (ngSubmit)="publish()">
      <app-activity-fields [form]="form" idPrefix="new-activity" titlePlaceholder="Ex.: Revisão Bibliográfica" />

      <app-field-list
        [fields]="fields()"
        hint="O que o grupo precisa preencher ao entregar. Pelo menos um campo."
        (remove)="removeField($event)"
      >
        <app-field-adder (added)="addField($event)" />
      </app-field-list>

      <div class="form-grid__full">
        <button type="submit" class="btn btn--primary" [disabled]="saving()">
          <app-icon name="plus" class="btn__icon" />
          {{ saving() ? 'Publicando…' : 'Publicar atividade' }}
        </button>
      </div>
    </form>
  </div>
</section>
