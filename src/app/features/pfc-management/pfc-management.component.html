<div class="page">
  <header>
    <p class="eyebrow">Planejamento acadêmico</p>
    <h1 class="page-title mt-2">Gestão de PFC</h1>
  </header>

  <nav class="tabs" aria-label="Seções da tela">
    @for (s of sections(); track s.id) {
      <button
        type="button"
        class="tabs__item"
        [attr.aria-pressed]="section() === s.id"
        (click)="section.set(s.id)"
      >
        {{ s.label }}
      </button>
    }
  </nav>

  @switch (section()) {
    @case ('program') {
      <app-program-section />
    }
    @case ('projects') {
      <app-project-section />
    }
    @case ('activities') {
      @if (activityFormOpen()) {
        <app-new-activity (closed)="activityFormOpen.set(false)" (created)="activityFormOpen.set(false)" />
      }
      <app-activity-schedule [canAdd]="!activityFormOpen()" (add)="activityFormOpen.set(true)" />
    }
  }
</div>
