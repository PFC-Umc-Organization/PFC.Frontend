<label class="sr-only" for="cohort">Turma</label>
<select id="cohort" class="control" [value]="store.cohortId()" (change)="choose($event)">
  @for (c of store.cohorts.value(); track c.id) {
    <option [value]="c.id" [selected]="c.id === store.cohortId()">{{ cohortLabel(c) }}</option>
  }
</select>
