<div class="page">
  <header>
    <p class="eyebrow">Administração</p>
    <h1 class="page-title mt-2">Usuários</h1>
  </header>

  <nav class="tabs" aria-label="Seções da tela">
    @for (s of sections; track s.id) {
      <button
        type="button"
        class="tabs__item"
        [attr.aria-pressed]="section() === s.id"
        (click)="section.set(s.id)"
      >
        {{ s.label }}
      </button>
    }
  </nav>

  @if (done()) {
    <p class="ok" role="status">
      <app-icon name="check" />
      <span>{{ done() }}</span>
    </p>
  }

  @switch (section()) {
    @case ('accounts') {
      @if (formOpen()) {
        <app-account-form (closed)="formOpen.set(false)" (created)="finish($event)" />
      }
      @for (v of [version()]; track v) {
        <app-user-list [canAdd]="!formOpen()" (add)="open()" />
      }
    }
    @case ('enrollments') {
      @if (formOpen()) {
        <app-enroll-form [cohorts]="cohorts()" (closed)="formOpen.set(false)" (created)="finish($event)" />
      }
      @for (v of [version()]; track v) {
        <app-enrollment-list [cohorts]="cohorts()" [canAdd]="!formOpen()" (add)="open()" />
      }
    }
  }
</div>
