<div class="field">
  <label class="field__label" [for]="idPrefix() + '-course'">Curso</label>
  <select
    [id]="idPrefix() + '-course'"
    class="control"
    [formControl]="form().controls.nome"
    [class.control--invalid]="invalid('nome')"
  >
    <option value="" disabled>Selecione o curso</option>
    @for (c of courses(); track c.id) {
      <option [value]="c.nome">{{ c.nome }}</option>
    }
  </select>
  @if (invalid('nome')) {
    <span class="field__error">Selecione o curso.</span>
  }
</div>

<div class="field">
  <label class="field__label" [for]="idPrefix() + '-shift'">Turno</label>
  <select [id]="idPrefix() + '-shift'" class="control" [formControl]="form().controls.turno">
    <option value="MANHA">Manhã</option>
    <option value="NOITE">Noite</option>
  </select>
</div>

<div class="field">
  <label class="field__label" [for]="idPrefix() + '-term'">Período</label>
  <input
    [id]="idPrefix() + '-term'"
    type="text"
    class="control"
    placeholder="Ex.: 2026.2"
    inputmode="decimal"
    [formControl]="form().controls.periodo"
    [class.control--invalid]="invalid('periodo')"
  />
  <span class="field__hint">Ano e semestre: 2026.1 ou 2026.2.</span>
  @if (invalid('periodo')) {
    <span class="field__error">Use ano e semestre, como 2026.2.</span>
  }
</div>
