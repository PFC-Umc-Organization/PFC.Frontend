<article class="deliverable" [class]="'deliverable tone-' + tone()">
  <div>
    <p class="status">{{ label() }}</p>
    <h3 class="title" [attr.title]="item().title">{{ item().title }}</h3>
  </div>

  <div class="bottom">
    <p class="deadline">
      <app-icon name="calendar" class="deadline__icon" />
      Até {{ item().deadline | deadline }}
    </p>

    @if (done()) {
      <p class="outcome outcome--done">
        <app-icon name="check" />
        <span class="outcome__text">{{ item().fileName ? 'Entregue: ' + item().fileName : 'Entregue' }}</span>
      </p>
    } @else if (late()) {
      <p class="outcome outcome--late">Prazo encerrado sem entrega</p>
    } @else if (!interactive()) {
      <p class="outcome">Prazo aberto</p>
    } @else {
      <a class="btn btn--primary btn--sm btn--block" routerLink="/entregaveis" [queryParams]="{ atividade: item().activityId }">
        Enviar entrega
      </a>
    }
  </div>
</article>
