<div class="password-wrap" [class.control-wrap]="withIcon()">
  @if (withIcon()) {
    <app-icon name="lock" class="control-wrap__icon" />
  }
  <input
    [id]="fieldId()"
    [type]="visible() ? 'text' : 'password'"
    class="control"
    [placeholder]="placeholder()"
    [attr.autocomplete]="autocomplete()"
    [attr.aria-describedby]="describedBy() || null"
    [formControl]="control()"
    [class.control--invalid]="invalid()"
  />
  <button
    type="button"
    class="password-wrap__toggle"
    [attr.aria-label]="visible() ? 'Ocultar senha' : 'Mostrar senha'"
    [attr.aria-pressed]="visible()"
    [attr.aria-controls]="fieldId()"
    (click)="visible.set(!visible())"
  >
    <app-icon [name]="visible() ? 'eye-off' : 'eye'" />
  </button>
</div>
