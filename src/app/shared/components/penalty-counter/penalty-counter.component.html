@if (compact() && penalties().reprovado) {
  <span class="failed">Reprovado</span>
} @else {
  <span class="counter" [class.counter--compact]="compact()" [class.counter--failed]="penalties().reprovado">
    <span class="bar" aria-hidden="true">
      @for (on of segments(); track $index) {
        <span class="bar__segment" [class.bar__segment--on]="on"></span>
      }
    </span>
    <span class="counter__text" [class.counter__text--none]="penalties().ativas === 0">{{ text() }}</span>
  </span>
}
